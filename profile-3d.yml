name: Update 3D contribution skyline

on:
  schedule:
    # 03:17 Nairobi time (00:17 UTC), once daily.
    - cron: "17 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/profile-3d.yml

permissions:
  contents: write

concurrency:
  group: profile-3d
  cancel-in-progress: false

jobs:
  generate:
    if: github.repository == 'iancecil/iancecil'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Generate 3D contribution calendars
        # Pinned to the upstream v0.9.3 release commit.
        uses: yoshi389111/github-profile-3d-contrib@7d95e7d4cdc028dd1e1cbd957d65f35efb12ae39
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Save updated contribution images
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- profile-3d-contrib/
          if git diff --cached --quiet; then
            echo "Contribution images are already up to date."
            exit 0
          fi
          git commit -m "Update 3D contribution skyline"
          git pull --rebase origin main
          git push origin HEAD:main
